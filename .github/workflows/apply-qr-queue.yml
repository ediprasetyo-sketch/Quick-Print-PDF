name: Cleanup temporary QR Queue wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.head_commit.author.username != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore clean main entrypoint
        shell: python
        run: |
          from pathlib import Path
          main = Path('main.js')
          text = main.read_text(encoding='utf-8')
          text = text.replace("require('./remote-queue');\n", '', 1)
          main.write_text(text, encoding='utf-8')
      - name: Remove temporary module and workflow
        run: |
          rm -f remote-queue.js .github/workflows/apply-qr-queue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js remote-queue.js .github/workflows/apply-qr-queue.yml
          git commit -m "revert temporary QR Queue wiring" || exit 0
          git push
