name: Validate QR lifecycle patch
on:
  push:
    branches: [fix/qr-lifecycle-v1.5.6]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          node --check bootstrap.js
          node --check preload.js
          node --check renderer.js
