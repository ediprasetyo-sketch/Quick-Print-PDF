name: Apply QR lifecycle V1.5.6
on:
  push:
    branches: [fix/qr-lifecycle-v1.5.6]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_qr_lifecycle_v1_5_6.py
      - name: Validate JavaScript
        run: |
          node --check bootstrap.js
          node --check preload.js
          node --check renderer.js
      - name: Commit patch
        run: |
          git rm -f .github/workflows/patch-qr-lifecycle-v1.5.6.yml
          git rm -f scripts/patch_qr_lifecycle_v1_5_6.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap.js preload.js renderer.js package.json
          git commit -m "V1.5.6: fix QR job status lifecycle"
          git push
