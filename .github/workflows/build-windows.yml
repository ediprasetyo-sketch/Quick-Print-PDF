name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Verify V1.5.5 version
        shell: powershell
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.5') {
            throw "Expected desktop version 1.5.5, found $($pkg.version)."
          }

      - name: Verify V1.5.5 desktop is tunnel-free
        shell: powershell
        run: |
          $files = Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\node_modules\\|\\.git\\|\\release\\' -and
              $_.Extension -in '.js','.json','.yml','.yaml','.bat','.cmd','.ps1'
            }

          $patterns = 'cloudflared','trycloudflare','startPublicTunnel','findCloudflared','uploadServer','uploadToken','Busboy'
          foreach ($file in $files) {
            $text = Get-Content $file.FullName -Raw
            foreach ($pattern in $patterns) {
              if ($text -match [regex]::Escape($pattern)) {
                throw "$($file.FullName) contains forbidden legacy QR tunnel/upload token: $pattern"
              }
            }
          }

          if (Test-Path "cloudflared.exe") { throw "cloudflared.exe must not be part of the desktop project." }
          if (Test-Path "setup-internet-qr.bat") { throw "setup-internet-qr.bat must not be part of the desktop project." }

      - name: Syntax check V1.5.5 desktop files
        run: |
          node --check main.js
          node --check bootstrap.js
          node --check preload.js
          node --check renderer.js

      - name: Build NSIS installer and portable EXE
        run: npm run dist

      - name: Verify Windows artifacts
        shell: powershell
        run: |
          $nsis = Get-ChildItem release -Filter 'Revo-Print-Shop-1.5.5-x64.exe' -File -ErrorAction SilentlyContinue
          $portable = Get-ChildItem release -Filter 'Revo-Print-Shop-1.5.5-x64-portable.exe' -File -ErrorAction SilentlyContinue
          if (-not $nsis) { throw 'NSIS installer artifact for V1.5.5 was not produced.' }
          if (-not $portable) { throw 'Portable artifact for V1.5.5 was not produced.' }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revo-print-shop-windows-v1.5.5
          path: release/*
          if-no-files-found: error
          retention-days: 14
