name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify V1.5.3 desktop has no legacy QR tunnel
        shell: powershell
        run: |
          $files = @('main.js','bootstrap.js','preload.js','renderer.js','package.json','electron-builder.yml')
          foreach ($file in $files) {
            $text = Get-Content $file -Raw
            if ($text -match 'cloudflared|trycloudflare|startPublicTunnel|findCloudflared|uploadServer|uploadToken|Busboy') {
              throw "$file still contains legacy desktop QR tunnel/upload code."
            }
          }
          if (Test-Path "cloudflared.exe") { throw "cloudflared.exe must not be part of the desktop project." }
          if (Test-Path "setup-internet-qr.bat") { throw "setup-internet-qr.bat must not be part of the desktop project." }

      - name: Syntax check V1.5.3 desktop files
        run: |
          node --check main.js
          node --check bootstrap.js
          node --check preload.js
          node --check renderer.js

      - name: Build NSIS installer and portable EXE
        run: npm run dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revo-print-shop-windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
