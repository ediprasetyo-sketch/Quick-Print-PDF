name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/qr-lifecycle-v1.5.6
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Verify V1.5.6 version
        shell: powershell
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.6') {
            throw "Expected desktop version 1.5.6, found $($pkg.version)."
          }
          if ($pkg.dependencies.PSObject.Properties.Name -contains 'busboy') {
            throw 'busboy must not be a direct desktop dependency.'
          }

      - name: Verify V1.5.6 desktop is tunnel-free
        shell: powershell
        run: |
          $files = Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\node_modules\\|\\.git\\|\\release\\|\\.github\\' -and
              $_.Name -ne 'package-lock.json' -and
              $_.Extension -in '.js','.json','.yml','.yaml','.bat','.cmd','.ps1'
            }

          $patterns = 'cloudflared','trycloudflare','startPublicTunnel','findCloudflared','uploadServer','uploadToken','Busboy'
          foreach ($file in $files) {
            $text = Get-Content $file.FullName -Raw
            foreach ($pattern in $patterns) {
              if ($text -match [regex]::Escape($pattern)) {
                throw "$($file.FullName) contains forbidden legacy QR tunnel/upload token: $pattern"
              }
            }
          }

          if (Test-Path "cloudflared.exe") { throw "Legacy tunnel binary must not be part of the desktop project." }
          if (Test-Path "setup-internet-qr.bat") { throw "Legacy QR setup script must not be part of the desktop project." }

      - name: Apply V1.5.6 QR modal exact-match UI patch
        shell: powershell
        run: |
          $base = Get-Content styles.css -Raw
          $patch = Get-Content qr-modal-exact.css -Raw
          Set-Content -Path styles.css -Value ($base + "`r`n`r`n" + $patch) -NoNewline
          Remove-Item qr-modal-exact.css -Force

      - name: Syntax check V1.5.6 desktop files
        run: |
          node --check main.js
          node --check bootstrap.js
          node --check preload.js
          node --check renderer.js
          node --check print.js

      - name: Build NSIS installer and portable EXE
        run: npm run dist

      - name: Verify Windows artifacts
        shell: powershell
        run: |
          $nsis = Get-ChildItem release -Filter 'Revo-Print-Shop-1.5.6-x64.exe' -File -ErrorAction SilentlyContinue
          $portable = Get-ChildItem release -Filter 'Revo-Print-Shop-1.5.6-x64-portable.exe' -File -ErrorAction SilentlyContinue
          if (-not $nsis) { throw 'NSIS installer artifact for V1.5.6 was not produced.' }
          if (-not $portable) { throw 'Portable artifact for V1.5.6 was not produced.' }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revo-print-shop-windows-v1.5.6
          path: release/*
          if-no-files-found: error
          retention-days: 14
