name: Apply QR lifecycle V1.5.7
on:
  push:
    branches: [fix/qr-lifecycle-v1.5.7]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch_qr_lifecycle_v1_5_7.py
      - name: Validate JavaScript
        run: |
          node --check bootstrap.js
          node --check renderer.js
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-qr-lifecycle-v1-5-7.yml scripts/patch_qr_lifecycle_v1_5_7.py
          git add bootstrap.js renderer.js package.json
          git diff --cached --check
          git commit -m "V1.5.7: sync QR job lifecycle with print result"
          git push
