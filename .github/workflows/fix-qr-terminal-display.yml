name: Fix QR terminal display
on:
  push:
    branches: [fix/qr-lifecycle-v1.5.6]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python3 scripts/fix_qr_terminal_display.py
      - name: Validate
        run: node --check bootstrap.js
      - name: Commit
        run: |
          git rm -f .github/workflows/fix-qr-terminal-display.yml scripts/fix_qr_terminal_display.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap.js
          git commit -m "V1.5.6: preserve terminal QR status"
          git push
